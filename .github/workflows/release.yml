name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Releases are not cancellable — once a tag is pushed, the build must complete.

permissions:
  contents: write    # create GitHub Release
  packages: write    # push to ghcr.io

jobs:
  version-guard:
    name: Assert every version surface matches tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare every version surface to the tag
        run: |
          # Every surface that reports a version must match the git tag we're
          # releasing. Prevents shipping a Docker image, MCP registry descriptor,
          # or release asset whose version drifts from the tag.
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag version: $TAG_VERSION"

          fail=0
          check() {
            local label="$1" value="$2"
            echo "$label: $value"
            if [ "$value" != "$TAG_VERSION" ]; then
              echo "::error::$label ($value) does not match tag ($TAG_VERSION)."
              fail=1
            fi
          }

          PYPROJECT_VERSION=$(grep -E '^version[[:space:]]*=[[:space:]]*"' pyproject.toml | head -1 | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          check "pyproject.toml"                    "$PYPROJECT_VERSION"

          COMPOSE_APP_TAG=$(grep -E 'image:[[:space:]]+ghcr\.io/mihaibuilds/memory-vault:' docker-compose.yml | head -1 | sed -E 's/.*memory-vault:([^[:space:]]+).*/\1/')
          check "docker-compose.yml app image tag"  "$COMPOSE_APP_TAG"

          SERVER_JSON_VERSION=$(python -c "import json; print(json.load(open('server.json'))['version'])")
          check "server.json version"               "$SERVER_JSON_VERSION"

          SERVER_JSON_MCP_TAG=$(python -c "import json; print(json.load(open('server.json'))['packages'][0]['identifier'].rsplit(':', 1)[1])")
          check "server.json MCP image tag"         "$SERVER_JSON_MCP_TAG"

          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more version surfaces drift from the tag. Bump every drifted file before re-tagging."
            exit 1
          fi

  docker:
    name: Build + push ${{ matrix.image }} (multi-arch) to ghcr.io
    runs-on: ubuntu-latest
    needs: version-guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: memory-vault
            dockerfile: Dockerfile
          - image: memory-vault-mcp
            dockerfile: Dockerfile.mcp
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/mihaibuilds/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
          # On a tag push the default branch flag is false, so re-enable :latest explicitly:
          flavor: |
            latest=true

      - name: Build + push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  publish-mcp-registry:
    name: Publish server.json to MCP Registry
    runs-on: ubuntu-latest
    needs: docker
    # OIDC identifies the workflow as belonging to the MihaiBuilds org, which
    # is what grants publish rights to the io.github.MihaiBuilds/* namespace.
    # No stored secret required.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          # Always pull the latest release — the registry is in preview and
          # the CLI is versioned alongside the API. Pinning risks an
          # "invalid audience" mismatch after a server-side change.
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Authenticate to MCP Registry via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        # version-guard has already asserted server.json.version matches the
        # git tag, so no in-workflow rewrite is needed here.
        run: ./mcp-publisher publish

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # full history so tag annotation message is available

      - name: Read tag annotation as release body
        id: tag_body
        run: |
          # Use the annotated tag's message as the release body. Falls back to a
          # short auto-generated note when the tag is lightweight (no message).
          BODY=$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")
          if [ -z "$BODY" ]; then
            BODY="Memory Vault ${GITHUB_REF_NAME} — see CHANGELOG.md and README for details."
          fi
          {
            echo "body<<__EOF__"
            echo "$BODY"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Stage release artifacts
        run: |
          # Snapshot docker-compose.yml so users on a tagged version can grab the
          # exact compose file that was current at release time, even after :latest
          # drifts upstream.
          mkdir -p _release_artifacts
          cp docker-compose.yml "_release_artifacts/docker-compose-${GITHUB_REF_NAME}.yml"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.tag_body.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            _release_artifacts/docker-compose-${{ github.ref_name }}.yml
