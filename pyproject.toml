[project]
name = "memory-vault"
version = "1.1.1"
description = "Local-first AI memory system with hybrid search — PostgreSQL + pgvector"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "MihaiBuilds" },
]
keywords = ["ai", "memory", "vector-search", "postgresql", "pgvector", "mcp"]

dependencies = [
    "psycopg[binary]>=3.3.4,<4",
    "psycopg-pool>=3.3.1,<4",
    "sentence-transformers>=5.7.0,<6",
    "numpy>=2.4.6",
    "python-dotenv>=1.2.2",
    # 2.x replaced mcp.server.fastmcp with mcp.server.mcpserver, so 1.x and 2.x
    # cannot both be supported by one import. The floor is 2.0.0 for that
    # reason rather than a feature need.
    "mcp>=2.0.0,<3.0.0",
    "fastapi>=0.141.1,<1",
    "uvicorn[standard]>=0.52.2,<1",
    "python-multipart>=0.0.32",
    "pydantic>=2.13.4,<3",
    "spacy>=3.8.14,<4",
    "structlog>=26.1.0,<27",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web", "content", "logs", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line-length handled by formatter; soft-wrap is fine
    "B008",  # FastAPI's Depends()/File()/Form() in defaults is the documented pattern
]

[tool.ruff.format]
quote-style = "double"

[project.scripts]
memory-vault = "memory_vault.cli:main"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"memory_vault.api" = ["static/**/*"]
"memory_vault" = ["migrations/*.sql"]
