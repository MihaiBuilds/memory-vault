[project]
name = "memory-vault"
version = "1.5.0"
description = "Local-first AI memory system with hybrid search — PostgreSQL + pgvector"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "MihaiBuilds" },
]
keywords = ["ai", "memory", "vector-search", "postgresql", "pgvector", "mcp"]

dependencies = [
    "psycopg[binary]>=3.3.4,<4",
    "psycopg-pool>=3.3.1,<4",
    "sentence-transformers>=5.7.0,<6",
    "numpy>=2.4.6",
    "python-dotenv>=1.2.3",
    # 2.x replaced mcp.server.fastmcp with mcp.server.mcpserver, so 1.x and 2.x
    # cannot both be supported by one import — that is why the floor sits in
    # the 2.x line at all. 2.1.1 specifically brings a request body limit to
    # the SSE endpoints, which matters once the HTTP transport lands.
    "mcp>=2.1.1,<3.0.0",
    "fastapi>=0.141.1,<1",
    "uvicorn[standard]>=0.52.4,<1",
    "python-multipart>=0.0.32",
    "pydantic>=2.13.4,<3",
    "spacy>=3.8.16,<4",
    "structlog>=26.1.0,<27",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "ruff>=0.16.5",
    # Used by the container-hardening tests to read docker-compose.yml. It
    # arrives transitively today; declaring it means a dependency bump cannot
    # silently take the test suite with it.
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# asyncio_mode = "auto" runs async tests without a per-module marker. Under the
# default "strict" mode a module that forgets `pytestmark = pytest.mark.asyncio`
# does not run its tests — it reports them as FAILED with "async def functions
# are not natively supported". That failure is indistinguishable at a glance
# from a genuine red result, so a test that never executed can be mistaken for
# proof that a bug reproduces.
asyncio_mode = "auto"
# Unknown marks become errors rather than silent no-ops, so a typo in a
# @pytest.mark name cannot quietly disable whatever it was guarding.
addopts = "--strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web", "content", "logs", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line-length handled by formatter; soft-wrap is fine
    "B008",  # FastAPI's Depends()/File()/Form() in defaults is the documented pattern
]

[tool.ruff.format]
quote-style = "double"

[project.scripts]
memory-vault = "memory_vault.cli:main"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"memory_vault.api" = ["static/**/*"]
"memory_vault" = ["migrations/*.sql"]
